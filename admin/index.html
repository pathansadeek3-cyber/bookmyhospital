<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Hospital Glass Preview</title><script src="../hospitals.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select{font:inherit}.shell{width:min(100%,460px);min-height:100vh;margin:auto;padding:24px 18px 34px;position:relative;z-index:2}.brand{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.01em}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:800;margin-top:24px;opacity:.65}.title{font-size:34px;line-height:1.06;font-weight:850;letter-spacing:-.04em;margin:8px 0}.sub{font-size:15px;line-height:1.5;opacity:.65;margin:0 0 16px}.glass{backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.55);box-shadow:0 16px 50px rgba(25,55,80,.11);border-radius:26px;padding:18px;margin:12px 0}.input{width:100%;border-radius:18px;padding:16px 17px;border:1px solid rgba(255,255,255,.6);outline:none;margin:7px 0}.btn{width:100%;min-height:54px;border:0;border-radius:18px;font-weight:800;margin:7px 0;cursor:pointer}.chip{display:inline-flex;padding:7px 11px;border-radius:999px;font-weight:750;font-size:12px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.meta{font-size:13px;opacity:.6;margin-top:3px}.token{font-size:64px;line-height:1;font-weight:900;letter-spacing:-.05em}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(120,140,160,.12)}.blob{position:fixed;border-radius:50%;filter:blur(4px);opacity:.6;z-index:0;animation:float 9s ease-in-out infinite alternate}@keyframes float{to{transform:translate3d(20px,-18px,0) scale(1.08)}}body{background:linear-gradient(145deg,#041c25,#073943 52%,#07534f);color:#fff}.blob.a{width:220px;height:220px;left:-110px;top:60px;background:#00d8c1;opacity:.22}.blob.b{width:280px;height:280px;right:-130px;top:360px;background:#4c9eff;opacity:.18;animation-delay:-3s}.brand,.glass,.input{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.16);box-shadow:0 20px 60px rgba(0,0,0,.18)}.sub,.meta{color:#b8ced2;opacity:1}.input{color:#fff}.input::placeholder{color:#9db7bb}select.input{color:#fff}select option{color:#111}.btn.main{background:linear-gradient(100deg,#49e4d1,#52b9ff);color:#04282f}.btn.ghost{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.14)}.teal{color:#49e4d1}.green{color:#49e4d1;background:#49e4d118}.amber{color:#ffd074;background:#ffd07416}</style></head><body><div class="blob a"></div><div class="blob b"></div><main class="shell" id="app"></main><script>let L=localStorage.getItem('glass_mh_lang')||'',linked=localStorage.getItem('glass_mh_hospital')||'';const head=(ey,t,s)=>`<span class="brand">✚ My Hospital</span><div class="eyebrow">${ey}</div><h1 class="title">${t}</h1><p class="sub">${s}</p>`;function setL(x){L=x;localStorage.setItem('glass_mh_lang',x);route()}function language(){app.innerHTML=head('HOSPITAL PARTNER','My Hospital','Secure reception & OPD queue control')+`<section class="glass"><h2>Choose language</h2><p class="sub">अपनी भाषा चुनें • तुमची भाषा निवडा</p><button class="btn ghost" onclick="setL('en')">English</button><button class="btn ghost" onclick="setL('hi')">हिंदी</button><button class="btn ghost" onclick="setL('mr')">मराठी</button></section>`}function route(){linked=localStorage.getItem('glass_mh_hospital')||'';if(!L)return language();linked?unlock():setup()}function setup(){app.innerHTML=head('FIRST-TIME SETUP','Connect this device to your hospital','Choose your verified hospital and enter the registered admin number.')+`<section class="glass"><select class="input" id="hs">${HOSPITALS.map(h=>`<option value="${h.id}">${h.name} — ${h.area}</option>`).join('')}</select><span class="chip green">✓ Partner Status: Verified</span><input class="input" id="ph" placeholder="Registered admin number" inputmode="numeric"><button class="btn main" onclick="verify()">Verify & create PIN</button></section>`}function verify(){let h=HOSPITALS.find(x=>x.id===hs.value);if(ph.value!==h.admin){alert('Demo registered number: '+h.admin);return}app.innerHTML=head('SECURITY','Protect hospital access',h.name)+`<section class="glass"><span class="chip green">✓ Hospital verified</span><h2>Create a 6-digit PIN</h2><p class="sub">Next time use this PIN or fingerprint / biometric.</p><input class="input" id="p1" placeholder="•••••• PIN" inputmode="numeric"><input class="input" id="p2" placeholder="Confirm PIN" inputmode="numeric"><label class="sub"><input id="bio" type="checkbox" checked> Enable fingerprint / biometric unlock</label><button class="btn main" onclick="activate('${h.id}')">Activate hospital admin</button></section>`}async function digest(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function activate(id){if(!/^\d{6}$/.test(p1.value)||p1.value!==p2.value){alert('PIN must be matching 6 digits');return}localStorage.setItem('glass_mh_hospital',id);localStorage.setItem('glass_mh_pin',await digest(p1.value));localStorage.setItem('glass_mh_bio',bio.checked?'1':'0');localStorage.setItem('glass_mh_cur','21');localStorage.setItem('glass_mh_wait','24');route()}function unlock(){let h=HOSPITALS.find(x=>x.id===linked);app.innerHTML=head('SECURE ACCESS','Welcome back',h.name)+`<section class="glass"><span class="chip green">● Device linked</span><input class="input" id="pin" placeholder="6-digit PIN" inputmode="numeric"><button class="btn main" onclick="unlockPin()">Unlock with PIN</button>${localStorage.getItem('glass_mh_bio')==='1'?'<button class="btn ghost" onclick="bioDemo()">☝ Use fingerprint / biometric</button>':''}<p class="sub">Hospital stays linked to this device until reset.</p></section>`}async function unlockPin(){(await digest(pin.value))===localStorage.getItem('glass_mh_pin')?dash():alert('Incorrect PIN')}function bioDemo(){alert('Browser version cannot invoke Android biometric hardware directly. Use the PIN for this web build.')}function dash(){let h=HOSPITALS.find(x=>x.id===linked),cur=+(localStorage.getItem('glass_mh_cur')||21),w=+(localStorage.getItem('glass_mh_wait')||24),paused=localStorage.getItem('glass_mh_pause')==='1';app.innerHTML=head('LIVE OPD',h.name,'Reception queue control')+`<section class="glass" style="text-align:center"><span class="chip ${paused?'amber':'green'}">● ${paused?'Queue paused':'Queue live'}</span><div class="meta" style="margin-top:18px">CURRENT TOKEN</div><div class="token teal">A${cur}</div><div class="row" style="justify-content:space-around;margin-top:12px"><div><div class="meta">WAITING</div><b class="teal">${w}</b></div><div><div class="meta">DONE</div><b class="teal">${Math.max(0,cur-1)}</b></div><div><div class="meta">AVG.</div><b class="teal">7m</b></div></div></section><button class="btn main" onclick="next()">▶ Call next patient</button><div class="row"><button class="btn ghost" onclick="next()">✓ Complete</button><button class="btn ghost" onclick="next()">↷ Skip</button></div><button class="btn ghost" onclick="pause()">${paused?'▶ Resume queue':'⏸ Pause queue'}</button><section class="glass"><h3>Upcoming queue</h3>${[1,2,3,4,5,6].map(i=>`<div class="stat"><b>A${cur+i}</b><span class="chip ${i%2?'amber':'green'}">${i%2?'WALK-IN':'ONLINE'}</span></div>`).join('')}</section><section class="glass"><button class="btn ghost" onclick="language()">🌐 Change language</button><button class="btn ghost" onclick="resetDevice()">Reset this device</button></section>`}function next(){if(localStorage.getItem('glass_mh_pause')==='1'){alert('Queue is paused');return}localStorage.setItem('glass_mh_cur',+(localStorage.getItem('glass_mh_cur')||21)+1);localStorage.setItem('glass_mh_wait',Math.max(0,+(localStorage.getItem('glass_mh_wait')||24)-1));dash()}function pause(){localStorage.setItem('glass_mh_pause',localStorage.getItem('glass_mh_pause')==='1'?'0':'1');dash()}function resetDevice(){if(confirm('Remove hospital link and PIN from this device?')){['glass_mh_hospital','glass_mh_pin','glass_mh_bio','glass_mh_cur','glass_mh_wait','glass_mh_pause'].forEach(k=>localStorage.removeItem(k));linked='';setup()}}route();</script></body></html>
