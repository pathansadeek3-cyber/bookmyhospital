<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookMyHospital Glass Preview</title><script src="hospitals.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select{font:inherit}.shell{width:min(100%,460px);min-height:100vh;margin:auto;padding:24px 18px 34px;position:relative;z-index:2}.brand{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.01em}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:800;margin-top:24px;opacity:.65}.title{font-size:34px;line-height:1.06;font-weight:850;letter-spacing:-.04em;margin:8px 0}.sub{font-size:15px;line-height:1.5;opacity:.65;margin:0 0 16px}.glass{backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);border:1px solid rgba(255,255,255,.55);box-shadow:0 16px 50px rgba(25,55,80,.11);border-radius:26px;padding:18px;margin:12px 0}.input{width:100%;border-radius:18px;padding:16px 17px;border:1px solid rgba(255,255,255,.6);outline:none;margin:7px 0}.btn{width:100%;min-height:54px;border:0;border-radius:18px;font-weight:800;margin:7px 0;cursor:pointer}.chip{display:inline-flex;padding:7px 11px;border-radius:999px;font-weight:750;font-size:12px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1}.hospital{cursor:pointer;transition:.2s transform}.hospital:active{transform:scale(.985)}.avatar{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;color:white;font-weight:900;font-size:20px}.name{font-weight:850;font-size:17px;letter-spacing:-.02em}.meta{font-size:13px;opacity:.6;margin-top:3px}.token{font-size:64px;line-height:1;font-weight:900;letter-spacing:-.05em}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(120,140,160,.12)}.nav{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:11px;font-weight:700}.nav b{display:block;font-size:20px;margin-bottom:4px}.blob{position:fixed;border-radius:50%;filter:blur(4px);opacity:.6;z-index:0;animation:float 9s ease-in-out infinite alternate}@keyframes float{to{transform:translate3d(20px,-18px,0) scale(1.08)}}body{background:linear-gradient(145deg,#eaf8ff,#eaf4ff 48%,#ebfff8);color:#122333}.blob.a{width:210px;height:210px;left:-90px;top:80px;background:#8bd6ff}.blob.b{width:260px;height:260px;right:-120px;top:310px;background:#93ffe0;animation-delay:-3s}.brand,.glass,.input{background:rgba(255,255,255,.58)}.btn.main,.avatar{background:linear-gradient(135deg,#2d81ff,#25c4cd);color:white}.btn.ghost{background:rgba(255,255,255,.55);color:#122333;border:1px solid rgba(255,255,255,.75)}.blue{color:#2373ef}.green{color:#159365;background:rgba(21,147,101,.09)}</style></head><body><div class="blob a"></div><div class="blob b"></div><main class="shell" id="app"></main><script>let L=localStorage.getItem('glass_bmh_lang')||'';const T={en:{tag:'Book from home. Follow the live OPD queue.',search:'Search hospital, doctor or speciality',hosp:'Hospitals in Latur',book:'Book token',cur:'Current token',ahead:'patients ahead'},hi:{tag:'घर से बुक करें। लाइव OPD कतार देखें।',search:'अस्पताल, डॉक्टर या विशेषज्ञता खोजें',hosp:'लातूर के अस्पताल',book:'टोकन बुक करें',cur:'वर्तमान टोकन',ahead:'मरीज आगे'},mr:{tag:'घरून बुक करा. लाईव्ह OPD रांग पहा.',search:'रुग्णालय, डॉक्टर किंवा विशेषज्ञता शोधा',hosp:'लातूरमधील रुग्णालये',book:'टोकन बुक करा',cur:'सध्याचे टोकन',ahead:'रुग्ण पुढे'}};const head=(ey,t,s)=>`<span class="brand">✚ BookMyHospital</span><div class="eyebrow">${ey}</div><h1 class="title">${t}</h1><p class="sub">${s}</p>`;function language(){app.innerHTML=head('WELCOME','BookMyHospital','Smart hospital queue booking for Latur')+`<section class="glass"><h2>Choose language</h2><p class="sub">अपनी भाषा चुनें • तुमची भाषा निवडा</p><button class="btn ghost" onclick="setL('en')">English</button><button class="btn ghost" onclick="setL('hi')">हिंदी</button><button class="btn ghost" onclick="setL('mr')">मराठी</button></section>`}function setL(x){L=x;localStorage.setItem('glass_bmh_lang',x);home()}function home(){let t=T[L];app.innerHTML=head('LATUR HEALTHCARE',L==='en'?'Find a hospital.<br>Skip the waiting room.':L==='hi'?'अस्पताल खोजें।<br>इंतजार कम करें।':'रुग्णालय शोधा.<br>प्रतीक्षा कमी करा.',t.tag)+`<input class="input" id="q" placeholder="${t.search}" oninput="render()"><div class="row"><span class="chip blue" style="background:#287cff12">📍 Latur</span><span class="chip" onclick="language()" style="background:#fff9;cursor:pointer">🌐 ${L==='en'?'English':L==='hi'?'हिंदी':'मराठी'}</span></div><h2 style="margin:25px 0 5px">${t.hosp}</h2><div id="list"></div><div class="glass nav"><div class="blue"><b>⌂</b>Home</div><div><b>⌕</b>Search</div><div><b>◷</b>Bookings</div><div><b>☺</b>Profile</div></div>`;render()}function render(){let qv=(q?.value||'').toLowerCase();list.innerHTML=HOSPITALS.filter(h=>(h.name+h.area).toLowerCase().includes(qv)).map(h=>`<section class="glass hospital" onclick="detail('${h.id}')"><div class="row"><div class="avatar">${h.name[0]}</div><div class="grow"><div class="name">${h.name}</div><div class="meta">${h.area} • Latur</div></div><b style="font-size:30px;opacity:.35">›</b></div><div class="row" style="margin-top:13px"><span class="chip green">● Live queue</span><span class="chip" style="background:#fff8">~7 min / patient</span></div></section>`).join('')}function detail(id){let h=HOSPITALS.find(x=>x.id===id),cur=+(localStorage['cur_'+id]||21);app.innerHTML=head('HOSPITAL',h.name,h.area+' • Latur')+`<section class="glass"><div class="row"><div class="grow"><div class="meta">${T[L].cur.toUpperCase()}</div><div class="token blue" style="font-size:45px">A${cur}</div></div><span class="chip green">● Running on time</span></div><p class="sub">📍 ${h.area}<br>☎ ${h.phone}</p><button class="btn main" onclick="book('${id}')">${T[L].book}</button></section><button class="btn ghost" onclick="home()">← Back</button>`}function book(id){let h=HOSPITALS.find(x=>x.id===id);app.innerHTML=head('BOOKING',h.name,'Your token is generated automatically.')+`<section class="glass"><input class="input" id="pn" placeholder="Patient name"><input class="input" id="pm" placeholder="Mobile number" inputmode="numeric"><select class="input"><option>General OPD</option><option>Dermatology</option><option>Orthopedic</option><option>ENT / Eye</option><option>Pediatrics</option></select><label class="sub"><input id="consent" type="checkbox"> I agree to share booking details with this hospital.</label><button class="btn main" onclick="confirmB('${id}')">Confirm booking</button></section>`}function confirmB(id){if(!pn.value||pm.value.length<10||!consent.checked){alert('Enter valid details and accept consent');return}let tok=+(localStorage['last_'+id]||45)+1;localStorage['last_'+id]=tok;let cur=+(localStorage['cur_'+id]||21),ahead=Math.max(0,tok-cur-1);app.innerHTML=head('BOOKING CONFIRMED','Your place is saved.',HOSPITALS.find(x=>x.id===id).name)+`<section class="glass" style="text-align:center"><div class="meta">YOUR TOKEN</div><div class="token blue">A${tok}</div><span class="chip green">● Confirmed</span></section><section class="glass"><div class="stat"><span>Current token</span><b class="blue">A${cur}</b></div><div class="stat"><span>Patients ahead</span><b class="blue">${ahead}</b></div><div class="stat"><span>Estimated turn</span><b class="blue">~${ahead*7} min ±20</b></div></section><button class="btn main" onclick="home()">Back to home</button>`}L?home():language();</script></body></html>
